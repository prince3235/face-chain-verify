services:
  - type: web
    name: face-chain-verify-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHAIN_MODE
        value: simulate
      - key: WEB_SEARCH_ENABLED
        value: true
      - key: CORS_ORIGINS
        value: "*"
